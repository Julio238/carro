
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Anúncio - Turbeiros Garage</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'tuned-red': '#e63946',
            'tuned-dark': '#171717'
          }
        }
      }
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* CABEÇALHO */

    .cabecalho-conteudo {
      max-width: 1280px;
      margin: auto;
      padding: 0 20px;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo-site {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    .menu-site {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      flex-wrap: wrap;
    }

    .menu-site a,
    .menu-site button {
      white-space: nowrap;
      font-size: 14px;
    }

    /* GALERIA */

    .galeria-principal {
      position: relative;
      width: 100%;
      height: 470px;
      background: #171717;
      overflow: hidden;
      border-radius: 16px;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .imagem-principal {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity .18s ease;
      display: block;
      pointer-events: none;
    }

    .seta-galeria {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, .65);
      color: white;
      font-size: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: background .2s, transform .2s;
    }

    .seta-galeria:hover {
      background: #e63946;
    }

    .seta-anterior {
      left: 12px;
    }

    .seta-proxima {
      right: 12px;
    }

    .contador-galeria {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, .75);
      color: white;
      padding: 7px 13px;
      border-radius: 30px;
      font-size: 13px;
      z-index: 5;
    }

    .miniatura {
      transition: all .2s ease;
      cursor: pointer;
    }

    .miniatura:hover {
      transform: translateY(-3px);
    }

    .miniatura.ativa {
      border-color: #e63946 !important;
      opacity: 1;
    }

    .miniatura:not(.ativa) {
      opacity: .7;
    }

    .whatsapp-btn {
      background: #16a34a;
      transition: background .2s ease, transform .2s ease;
    }

    .whatsapp-btn:hover {
      background: #15803d;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* AJUSTES PARA CELULAR */

    @media (max-width: 640px) {
      .cabecalho-conteudo {
        min-height: auto;
        padding: 13px 12px;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
      }

      .logo-site {
        font-size: 22px;
        text-align: center;
      }

      .menu-site {
        width: 100%;
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: center;
        gap: 17px;
      }

      .menu-site a,
      .menu-site button {
        font-size: 13px;
      }

      .galeria-principal {
        height: 300px;
        border-radius: 12px;
      }

      .seta-galeria {
        width: 36px;
        height: 36px;
        font-size: 23px;
        background: rgba(0, 0, 0, .7);
      }

      .seta-anterior {
        left: 7px;
      }

      .seta-proxima {
        right: 7px;
      }
    }

    @media (max-width: 360px) {
      .logo-site {
        font-size: 19px;
      }

      .menu-site {
        gap: 12px;
      }

      .menu-site a,
      .menu-site button {
        font-size: 12px;
      }

      .galeria-principal {
        height: 260px;
      }
    }
  </style>
</head>

<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100">

  <!-- CABEÇALHO -->
  <header class="bg-tuned-dark text-white shadow-lg sticky top-0 z-50">
    <div class="cabecalho-conteudo">

      <a href="index.html" class="logo-site">
        TURBEIROS <span class="text-tuned-red">GARAGE</span>
      </a>

      <nav id="mainNav" class="menu-site">
        <a href="index.html" class="hover:text-tuned-red transition">Início</a>
        <a href="login.html" class="hover:text-tuned-red transition">Entrar</a>
      </nav>

    </div>
  </header>

  <main class="container mx-auto px-4 py-6 md:py-10">

    <div id="mensagem" class="max-w-6xl mx-auto mb-6 text-center text-gray-600 dark:text-gray-300">
      Carregando anúncio...
    </div>

    <div id="conteudoAnuncio" class="max-w-6xl mx-auto hidden"></div>

  </main>

  <footer class="bg-tuned-dark text-gray-300 text-center py-7 mt-12 px-4">
    <p class="font-semibold">© 2026 Turbeiros Garage</p>
    <p class="text-sm mt-1">Paixão por máquinas, respeito pela estrada.</p>
  </footer>

  <script>
    const db = window.supabaseClient;

    const mensagem = document.getElementById('mensagem');
    const conteudo = document.getElementById('conteudoAnuncio');
    const nav = document.getElementById('mainNav');

    const params = new URLSearchParams(window.location.search);
    const vehicleId = params.get('id');

    const WHATSAPP_NUMERO = '5541988204612';

    let currentUser = null;
    let isAdmin = false;
    let isFavorite = false;
    let vehicle = null;
    let imagens = [];
    let imagemAtual = 0;
    let inicioToqueX = 0;
    let inicioToqueY = 0;

    function escapar(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[caractere]);
    }

    function formatarPreco(valor) {
      if (valor === null || valor === undefined || valor === '') {
        return 'Consulte o preço';
      }

      const numero = Number(valor);

      if (!Number.isFinite(numero)) {
        return 'Consulte o preço';
      }

      return numero.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function formatarAno(valor) {
      return valor ? escapar(valor) : 'Não informado';
    }

    function formatarData(valor) {
      if (!valor) return 'Data não informada';

      const data = new Date(valor);

      if (Number.isNaN(data.getTime())) {
        return 'Data não informada';
      }

      return data.toLocaleDateString('pt-BR');
    }

    function mostrarMensagem(texto, erro = false) {
      mensagem.textContent = texto;

      mensagem.className = erro
        ? 'max-w-6xl mx-auto mb-6 text-center text-red-600 font-semibold'
        : 'max-w-6xl mx-auto mb-6 text-center text-gray-600 dark:text-gray-300';
    }

    async function carregarUsuario() {
      const { data, error } = await db.auth.getUser();

      if (error) {
        console.error('Erro ao verificar usuário:', error);
      }

      currentUser = data?.user || null;

      if (currentUser) {
        const { data: adminData, error: adminError } =
          await db.rpc('is_admin');

        if (!adminError) {
          isAdmin = adminData === true;
        }
      }

      atualizarMenu();
    }

    function atualizarMenu() {
      if (currentUser) {
        nav.innerHTML = `
          <a href="index.html" class="hover:text-tuned-red transition">Início</a>

          <a href="perfil.html" class="hover:text-tuned-red transition">
            Meu perfil
          </a>

          ${isAdmin ? '<a href="admin.html" class="text-green-400">Admin</a>' : ''}

          <button
            id="btnSair"
            class="bg-red-600 hover:bg-red-700 px-3 py-2 rounded-lg transition"
          >
            Sair
          </button>
        `;

        document.getElementById('btnSair')
          .addEventListener('click', sair);

      } else {
        nav.innerHTML = `
          <a href="index.html" class="hover:text-tuned-red transition">Início</a>

          <a href="login.html" class="hover:text-tuned-red transition">Entrar</a>

          <a
            href="cadastro.html"
            class="bg-tuned-red hover:bg-red-700 px-3 py-2 rounded-lg transition"
          >
            Cadastrar
          </a>
        `;
      }
    }

    async function sair() {
      const { error } = await db.auth.signOut();

      if (error) {
        alert('Não foi possível sair da conta: ' + error.message);
        return;
      }

      window.location.href = 'index.html';
    }

    async function carregarAnuncio() {
      if (!vehicleId) {
        mostrarMensagem('Anúncio não encontrado. Identificador ausente.', true);
        return;
      }

      const { data, error } = await db
        .from('vehicles')
        .select(`
          id,
          brand,
          model,
          year,
          price,
          description,
          status,
          created_at,
          vehicle_images (
            id,
            image_url,
            position
          )
        `)
        .eq('id', vehicleId)
        .maybeSingle();

      if (error) {
        console.error('Erro ao carregar anúncio:', error);
        mostrarMensagem('Não foi possível carregar o anúncio. Tente novamente.', true);
        return;
      }

      if (!data) {
        mostrarMensagem('Anúncio não encontrado ou você não tem permissão para visualizá-lo.', true);
        return;
      }

      if (data.status !== 'published' && !isAdmin) {
        mostrarMensagem('Este anúncio não está disponível.', true);
        return;
      }

      vehicle = data;

      imagens = (data.vehicle_images || [])
        .filter(item => item.image_url)
        .sort((a, b) => (a.position || 0) - (b.position || 0));

      imagemAtual = 0;

      await verificarFavorito();
      renderizarAnuncio();
    }

    async function verificarFavorito() {
      isFavorite = false;

      if (!currentUser || !vehicle) return;

      const { data, error } = await db
        .from('favorites')
        .select('vehicle_id')
        .eq('user_id', currentUser.id)
        .eq('vehicle_id', vehicle.id)
        .maybeSingle();

      if (error) {
        console.error('Erro ao verificar favorito:', error);
        return;
      }

      isFavorite = !!data;
    }

    function gerarLinkWhatsApp() {
      const nomeVeiculo = `${vehicle.brand} ${vehicle.model}`;
      const preco = formatarPreco(vehicle.price);

      const texto =
        `Olá! Tenho interesse no veículo ${nomeVeiculo} anunciado na Turbeiros Garage.` +
        `\nAno: ${vehicle.year || 'Não informado'}` +
        `\nPreço: ${preco}` +
        `\nLink do anúncio: ${window.location.href}` +
        `\n\nGostaria de mais informações!`;

      return `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(texto)}`;
    }

    async function copiarLinkAnuncio() {
      const link = window.location.href;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(link);
        } else {
          const campo = document.createElement('textarea');
          campo.value = link;
          campo.style.position = 'fixed';
          campo.style.opacity = '0';

          document.body.appendChild(campo);
          campo.select();

          const copiou = document.execCommand('copy');
          campo.remove();

          if (!copiou) {
            throw new Error('Não foi possível copiar o link.');
          }
        }

        const botao = document.getElementById('btnCopiarLink');

        if (botao) {
          const textoOriginal = botao.textContent;
          botao.textContent = '✓ Link copiado!';

          setTimeout(() => {
            botao.textContent = textoOriginal;
          }, 2200);
        }

      } catch (error) {
        console.error('Erro ao copiar link:', error);
        alert('Não foi possível copiar automaticamente. Copie o endereço na barra do navegador.');
      }
    }

    async function compartilharAnuncio() {
      const dados = {
        title: `${vehicle.brand} ${vehicle.model} | Turbeiros Garage`,
        text: `Confira este veículo na Turbeiros Garage: ${vehicle.brand} ${vehicle.model}`,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(dados);
        } catch (error) {
          if (error.name !== 'AbortError') {
            console.error('Erro ao compartilhar:', error);
            await copiarLinkAnuncio();
          }
        }
      } else {
        await copiarLinkAnuncio();
        alert('Este navegador não oferece compartilhamento direto. O link do anúncio foi copiado.');
      }
    }

    /* NAVEGAÇÃO DA GALERIA */

    function trocarImagem(index) {
      if (!imagens[index]) return;

      imagemAtual = index;

      const principal = document.getElementById('imagemPrincipal');

      if (principal) {
        principal.style.opacity = '0.35';

        principal.onload = () => {
          principal.style.opacity = '1';
        };

        principal.onerror = () => {
          principal.style.opacity = '1';
        };

        principal.src = imagens[index].image_url;
      }

      const contador = document.getElementById('contadorImagem');

      if (contador) {
        contador.textContent = index + 1;
      }

      document.querySelectorAll('.miniatura').forEach(botao => {
        const ativo = Number(botao.dataset.index) === index;

        botao.classList.toggle('ativa', ativo);
        botao.setAttribute('aria-pressed', ativo ? 'true' : 'false');
      });
    }

    function proximaImagem() {
      if (imagens.length <= 1) return;

      const proxima = (imagemAtual + 1) % imagens.length;
      trocarImagem(proxima);
    }

    function imagemAnterior() {
      if (imagens.length <= 1) return;

      const anterior = (imagemAtual - 1 + imagens.length) % imagens.length;
      trocarImagem(anterior);
    }

    function configurarDeslize() {
      const galeria = document.getElementById('galeriaPrincipal');

      if (!galeria) return;

      galeria.addEventListener('touchstart', evento => {
        if (!evento.touches || evento.touches.length !== 1) return;

        inicioToqueX = evento.touches[0].clientX;
        inicioToqueY = evento.touches[0].clientY;
      }, { passive: true });

      galeria.addEventListener('touchend', evento => {
        if (!evento.changedTouches || evento.changedTouches.length !== 1) return;

        const fimX = evento.changedTouches[0].clientX;
        const fimY = evento.changedTouches[0].clientY;

        const diferencaX = fimX - inicioToqueX;
        const diferencaY = fimY - inicioToqueY;

        /* Só troca a foto se o movimento for horizontal */
        if (Math.abs(diferencaX) > 45 &&
            Math.abs(diferencaX) > Math.abs(diferencaY) * 1.2) {

          if (diferencaX < 0) {
            proximaImagem();
          } else {
            imagemAnterior();
          }
        }
      }, { passive: true });
    }

    function renderizarAnuncio() {
      const primeiraImagem = imagens.length
        ? imagens[0].image_url
        : '';

      const marca = escapar(vehicle.brand);
      const modelo = escapar(vehicle.model);

      const descricao = escapar(
        vehicle.description ||
        'Nenhuma descrição foi informada para este veículo.'
      );

      const statusTexto = vehicle.status === 'published'
        ? 'Disponível'
        : vehicle.status === 'sold'
          ? 'Vendido'
          : 'Não publicado';

      const statusClasse = vehicle.status === 'published'
        ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300'
        : 'bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200';

      const linkWhatsApp = gerarLinkWhatsApp();

      conteudo.innerHTML = `

        <div class="mb-5">
          <a
            href="index.html"
            class="inline-flex items-center gap-2 text-gray-600 dark:text-gray-400 hover:text-tuned-red transition"
          >
            ← Voltar para os anúncios
          </a>
        </div>

        <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-xl overflow-hidden">

          <div class="p-4 sm:p-6 md:p-8 border-b border-gray-200 dark:border-gray-800">

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">

              <div class="min-w-0">
                <p class="text-sm uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-2">
                  Turbeiros Garage / Veículos
                </p>

                <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold break-words">
                  ${marca} ${modelo}
                </h1>

                <div class="mt-3">
                  <span class="inline-block px-3 py-1 rounded-full text-sm font-semibold ${statusClasse}">
                    ${statusTexto}
                  </span>
                </div>
              </div>

              <div class="md:text-right">
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-1">
                  Valor anunciado
                </p>

                <p class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-tuned-red break-words">
                  ${formatarPreco(vehicle.price)}
                </p>
              </div>

            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 md:gap-8 p-4 sm:p-6 md:p-8">

            <!-- GALERIA -->

            <section class="lg:col-span-3 min-w-0">

              <div id="galeriaPrincipal" class="galeria-principal">

                ${
                  primeiraImagem
                    ? `
                      <img
                        id="imagemPrincipal"
                        src="${escapar(primeiraImagem)}"
                        alt="${marca} ${modelo}"
                        class="imagem-principal"
                        onerror="this.style.display='none'; document.getElementById('imagemIndisponivel').classList.remove('hidden');"
                      />

                      <div
                        id="imagemIndisponivel"
                        class="hidden absolute inset-0 flex items-center justify-center text-gray-400"
                      >
                        <div class="text-center">
                          <div class="text-6xl mb-3">🚗</div>
                          <p>Foto não disponível</p>
                        </div>
                      </div>
                    `
                    : `
                      <div
                        id="imagemIndisponivel"
                        class="absolute inset-0 flex items-center justify-center text-gray-400"
                      >
                        <div class="text-center">
                          <div class="text-6xl mb-3">🚗</div>
                          <p>Foto não disponível</p>
                        </div>
                      </div>
                    `
                }

                ${
                  imagens.length > 1
                    ? `
                      <button
                        type="button"
                        id="btnImagemAnterior"
                        class="seta-galeria seta-anterior"
                        aria-label="Foto anterior"
                      >‹</button>

                      <button
                        type="button"
                        id="btnProximaImagem"
                        class="seta-galeria seta-proxima"
                        aria-label="Próxima foto"
                      >›</button>
                    `
                    : ''
                }

                ${
                  imagens.length
                    ? `
                      <div class="contador-galeria">
                        <span id="contadorImagem">1</span> / ${imagens.length}
                      </div>
                    `
                    : ''
                }

              </div>

              ${
                imagens.length > 1
                  ? `
                    <p class="text-center text-xs text-gray-500 dark:text-gray-400 mt-3 mb-3">
                      ← Deslize a foto para ver outras imagens →
                    </p>

                    <div class="grid grid-cols-4 sm:grid-cols-5 gap-2 sm:gap-3">

                      ${imagens.map((imagem, index) => `
                        <button
                          type="button"
                          class="miniatura ${index === 0 ? 'ativa' : ''} rounded-xl overflow-hidden border-2 border-transparent"
                          data-index="${index}"
                          aria-label="Ver foto ${index + 1}"
                          aria-pressed="${index === 0 ? 'true' : 'false'}"
                        >
                          <img
                            src="${escapar(imagem.image_url)}"
                            alt="Foto ${index + 1}"
                            class="w-full h-14 sm:h-20 object-cover"
                            loading="lazy"
                            onerror="this.style.opacity='0.2'"
                          />
                        </button>
                      `).join('')}

                    </div>
                  `
                  : ''
              }

            </section>

            <!-- INFORMAÇÕES -->

            <section class="lg:col-span-2 flex flex-col min-w-0">

              <div class="mb-5">
                <h2 class="text-2xl font-bold">
                  Informações do veículo
                </h2>

                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">
                  Confira os detalhes deste anúncio.
                </p>
              </div>

              <div class="grid grid-cols-2 gap-3 mb-7">

                <div class="bg-gray-100 dark:bg-gray-800 p-3 sm:p-4 rounded-xl min-w-0">
                  <p class="text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">
                    Marca
                  </p>
                  <p class="font-bold text-base sm:text-lg mt-1 break-words">
                    ${marca}
                  </p>
                </div>

                <div class="bg-gray-100 dark:bg-gray-800 p-3 sm:p-4 rounded-xl min-w-0">
                  <p class="text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">
                    Modelo
                  </p>
                  <p class="font-bold text-base sm:text-lg mt-1 break-words">
                    ${modelo}
                  </p>
                </div>

                <div class="bg-gray-100 dark:bg-gray-800 p-3 sm:p-4 rounded-xl">
                  <p class="text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">
                    Ano
                  </p>
                  <p class="font-bold text-base sm:text-lg mt-1">
                    ${formatarAno(vehicle.year)}
                  </p>
                </div>

                <div class="bg-gray-100 dark:bg-gray-800 p-3 sm:p-4 rounded-xl">
                  <p class="text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">
                    Anunciado em
                  </p>
                  <p class="font-bold text-base sm:text-lg mt-1">
                    ${formatarData(vehicle.created_at)}
                  </p>
                </div>

              </div>

              <div class="mb-7">
                <h2 class="text-xl font-bold mb-3">
                  Descrição
                </h2>

                <div class="bg-gray-100 dark:bg-gray-800 rounded-xl p-4">
                  <p class="text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-line">
                    ${descricao}
                  </p>
                </div>
              </div>

              <div class="mt-auto space-y-3">

                <div class="rounded-2xl border border-green-200 dark:border-green-900 bg-green-50 dark:bg-green-950/40 p-4">

                  <p class="font-bold text-green-800 dark:text-green-300 text-center">
                    Gostou deste veículo?
                  </p>

                  <p class="text-sm text-green-700 dark:text-green-400 text-center mt-1">
                    Fale com a Turbeiros Garage pelo WhatsApp.
                  </p>

                  <a
                    href="${linkWhatsApp}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="whatsapp-btn mt-4 flex items-center justify-center gap-3 w-full text-white font-extrabold py-4 px-3 rounded-xl text-base sm:text-lg shadow-lg text-center"
                  >
                    <span class="text-2xl" aria-hidden="true">☏</span>
                    Tenho interesse — WhatsApp
                  </a>

                </div>

                <button
                  id="btnFavorito"
                  class="w-full border-2 border-tuned-red text-tuned-red hover:bg-tuned-red hover:text-white font-bold py-3 px-4 rounded-xl transition"
                >
                  ${isFavorite ? '♥ Remover dos favoritos' : '♡ Adicionar aos favoritos'}
                </button>

                <div class="grid grid-cols-2 gap-3">

                  <button
                    id="btnCompartilhar"
                    type="button"
                    class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-2 sm:px-3 rounded-xl transition text-sm sm:text-base"
                  >
                    ↗ Compartilhar
                  </button>

                  <button
                    id="btnCopiarLink"
                    type="button"
                    class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white font-bold py-3 px-2 sm:px-3 rounded-xl transition text-sm sm:text-base"
                  >
                    ⧉ Copiar link
                  </button>

                </div>

                <a
                  href="index.html"
                  class="block w-full text-center bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-5 rounded-xl transition"
                >
                  Ver outros veículos
                </a>

                <p class="text-center text-xs text-gray-500 dark:text-gray-400">
                  Entre em contato para saber mais sobre este veículo.
                </p>

              </div>

            </section>

          </div>
        </div>

        <div class="text-center mt-8 text-gray-500 dark:text-gray-400 text-sm">
          <p>Turbeiros Garage — Seu próximo projeto começa aqui.</p>
        </div>
      `;

      mensagem.textContent = '';
      conteudo.classList.remove('hidden');

      document.getElementById('btnFavorito')
        .addEventListener('click', alternarFavorito);

      document.getElementById('btnCompartilhar')
        .addEventListener('click', compartilharAnuncio);

      document.getElementById('btnCopiarLink')
        .addEventListener('click', copiarLinkAnuncio);

      const btnAnterior = document.getElementById('btnImagemAnterior');
      const btnProxima = document.getElementById('btnProximaImagem');

      if (btnAnterior) {
        btnAnterior.addEventListener('click', imagemAnterior);
      }

      if (btnProxima) {
        btnProxima.addEventListener('click', proximaImagem);
      }

      document.querySelectorAll('.miniatura').forEach(botao => {
        botao.addEventListener('click', () => {
          trocarImagem(Number(botao.dataset.index));
        });
      });

      configurarDeslize();
    }

    async function alternarFavorito() {
      if (!currentUser) {
        alert('Entre na sua conta para adicionar este veículo aos favoritos.');
        window.location.href = 'login.html';
        return;
      }

      const botao = document.getElementById('btnFavorito');

      botao.disabled = true;
      botao.textContent = 'Aguarde...';

      let error = null;

      if (isFavorite) {
        const resultado = await db
          .from('favorites')
          .delete()
          .eq('user_id', currentUser.id)
          .eq('vehicle_id', vehicle.id);

        error = resultado.error;

      } else {
        const resultado = await db
          .from('favorites')
          .insert({
            user_id: currentUser.id,
            vehicle_id: vehicle.id
          });

        error = resultado.error;
      }

      if (error) {
        console.error('Erro ao atualizar favorito:', error);
        alert('Não foi possível atualizar os favoritos: ' + error.message);
      } else {
        isFavorite = !isFavorite;
      }

      botao.disabled = false;

      botao.textContent = isFavorite
        ? '♥ Remover dos favoritos'
        : '♡ Adicionar aos favoritos';
    }

    async function iniciarPagina() {
      if (!db) {
        mostrarMensagem('Conexão com o Supabase não encontrada.', true);
        return;
      }

      await carregarUsuario();
      await carregarAnuncio();
    }

    iniciarPagina();
  </script>

</body>
</html>
