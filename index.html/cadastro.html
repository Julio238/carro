
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Turbeiros Garage</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'tuned-red': '#dc2626',
            'tuned-dark': '#030712'
          }
        }
      }
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
    }

    /* CABEÇALHO PADRÃO DO SITE */
    .cabecalho {
      background: #030712;
      color: white;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 15px rgba(0,0,0,.2);
    }

    .cabecalho-conteudo {
      max-width: 1152px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .marca-site {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.2;
      white-space: nowrap;
      color: white;
      text-decoration: none;
    }

    .marca-site span {
      color: #dc2626;
    }

    .subtitulo-site {
      color: #9ca3af;
      font-size: 12px;
      margin-top: 3px;
    }

    .menu-cabecalho {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .link-menu {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 7px;
      transition: .2s;
    }

    .link-menu:hover {
      background: #1f2937;
    }

    .link-menu.destaque {
      background: #dc2626;
    }

    .link-menu.destaque:hover {
      background: #b91c1c;
    }

    /* FORMULÁRIO */
    .campo-cadastro {
      width: 100%;
      padding: 13px 14px;
      border-radius: 9px;
      border: 1px solid #d1d5db;
      outline: none;
      font-size: 16px;
      transition: .2s;
    }

    .campo-cadastro:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220,38,38,.12);
    }

    .botao-cadastro {
      width: 100%;
      min-height: 50px;
      border-radius: 9px;
      background: #dc2626;
      color: white;
      font-weight: 800;
      font-size: 16px;
      transition: .2s;
    }

    .botao-cadastro:hover {
      background: #b91c1c;
    }

    .botao-cadastro:disabled {
      opacity: .6;
      cursor: wait;
    }

    .cartao-cadastro {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 35px rgba(0,0,0,.09);
      border: 1px solid #e5e7eb;
    }

    @media (max-width: 640px) {
      .cabecalho-conteudo {
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 13px 12px;
      }

      .marca-container {
        width: 100%;
        text-align: center;
      }

      .marca-site {
        font-size: 21px;
      }

      .menu-cabecalho {
        width: 100%;
        justify-content: center;
      }

      .link-menu {
        font-size: 13px;
        padding: 10px 15px;
      }

      .area-cadastro {
        padding: 25px 12px !important;
        align-items: flex-start !important;
      }

      .cartao-cadastro {
        padding: 22px 17px;
        border-radius: 14px;
      }

      .titulo-cadastro {
        font-size: 26px;
      }

      .rodape {
        padding: 22px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <div class="cabecalho-conteudo">

      <div class="marca-container">
        <a href="index.html" class="marca-site">
          TURBEIROS <span>GARAGE</span>
        </a>
        <p class="subtitulo-site">Carros modificados e preparados</p>
      </div>

      <nav class="menu-cabecalho">
        <a href="index.html" class="link-menu">
          Início
        </a>

        <a href="login.html" class="link-menu destaque">
          Entrar
        </a>
      </nav>

    </div>
  </header>

  <!-- CADASTRO -->
  <main class="flex-grow flex items-center justify-center py-12 px-4 area-cadastro">

    <div class="cartao-cadastro">

      <div class="text-center mb-8">

        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-red-100 text-red-600 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
            viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="10" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
        </div>

        <h1 class="titulo-cadastro text-3xl font-black mb-2">
          Criar sua conta
        </h1>

        <p class="text-gray-600 dark:text-gray-400 text-sm">
          Faça parte da comunidade Turbeiros Garage.
        </p>

      </div>

      <form id="cadastroForm" class="space-y-5">

        <div>
          <label for="nome" class="block text-sm font-bold mb-2">
            Nome completo
          </label>

          <input
            type="text"
            id="nome"
            required
            autocomplete="name"
            placeholder="Seu nome"
            class="campo-cadastro bg-white dark:bg-gray-700 dark:border-gray-600"
          >
        </div>

        <div>
          <label for="email" class="block text-sm font-bold mb-2">
            E-mail
          </label>

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="seuemail@gmail.com"
            class="campo-cadastro bg-white dark:bg-gray-700 dark:border-gray-600"
          >
        </div>

        <div>
          <label for="telefone" class="block text-sm font-bold mb-2">
            Telefone / WhatsApp
          </label>

          <input
            type="tel"
            id="telefone"
            required
            autocomplete="tel"
            placeholder="(41) 99999-9999"
            class="campo-cadastro bg-white dark:bg-gray-700 dark:border-gray-600"
          >
        </div>

        <div>
          <label for="cidade" class="block text-sm font-bold mb-2">
            Cidade
          </label>

          <input
            type="text"
            id="cidade"
            required
            autocomplete="address-level2"
            placeholder="Sua cidade"
            class="campo-cadastro bg-white dark:bg-gray-700 dark:border-gray-600"
          >
        </div>

        <div>
          <label for="senha" class="block text-sm font-bold mb-2">
            Senha
          </label>

          <input
            type="password"
            id="senha"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
            class="campo-cadastro bg-white dark:bg-gray-700 dark:border-gray-600"
          >

          <p class="text-xs text-gray-500 mt-2">
            Utilize pelo menos 8 caracteres.
          </p>
        </div>

        <div>
          <label for="confirmarSenha" class="block text-sm font-bold mb-2">
            Confirmar senha
          </label>

          <input
            type="password"
            id="confirmarSenha"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Digite novamente"
            class="campo-cadastro bg-white dark:bg-gray-700 dark:border-gray-600"
          >
        </div>

        <div class="flex items-start gap-2 pt-1">
          <input
            type="checkbox"
            id="termos"
            required
            class="h-5 w-5 mt-0.5 accent-red-600 flex-shrink-0"
          >

          <label for="termos" class="text-sm leading-5 text-gray-700 dark:text-gray-300">
            Aceito os termos de uso e a política de privacidade.
          </label>
        </div>

        <div
          id="mensagem"
          role="alert"
          aria-live="polite"
          class="hidden text-center text-sm font-medium p-3 rounded-lg"
        ></div>

        <button
          type="submit"
          id="btnCadastrar"
          class="botao-cadastro"
        >
          Criar minha conta
        </button>

      </form>

      <div class="mt-7 pt-6 border-t border-gray-200 dark:border-gray-700 text-center">

        <p class="text-sm text-gray-600 dark:text-gray-400">
          Já tem uma conta?
        </p>

        <a
          href="login.html"
          class="inline-block mt-2 text-red-600 hover:text-red-700 font-bold hover:underline"
        >
          Entrar na minha conta
        </a>

      </div>

    </div>

  </main>

  <!-- RODAPÉ -->
  <footer class="bg-gray-950 text-white py-8 text-center rodape">
    <p class="text-gray-400">
      © 2026 Turbeiros Garage - Marketplace de Carros Modificados
    </p>
  </footer>

  <script>
    const db = window.supabaseClient;

    const form = document.getElementById('cadastroForm');
    const mensagem = document.getElementById('mensagem');
    const botao = document.getElementById('btnCadastrar');

    function mostrarMensagem(texto, tipo = 'erro') {
      mensagem.textContent = texto;
      mensagem.classList.remove('hidden');

      mensagem.className =
        'text-center text-sm font-medium p-3 rounded-lg ' +
        (tipo === 'sucesso'
          ? 'bg-green-100 text-green-700'
          : 'bg-red-100 text-red-700');
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      if (!db) {
        mostrarMensagem(
          'Conexão com o Supabase não encontrada. Verifique o supabaseClient.js.'
        );
        return;
      }

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const telefone = document.getElementById('telefone').value.trim();
      const cidade = document.getElementById('cidade').value.trim();
      const senha = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmarSenha').value;

      if (!nome || !email || !telefone || !cidade) {
        mostrarMensagem('Preencha todos os campos.');
        return;
      }

      if (senha.length < 8) {
        mostrarMensagem('A senha precisa ter pelo menos 8 caracteres.');
        return;
      }

      if (senha !== confirmar) {
        mostrarMensagem('As senhas não coincidem.');
        return;
      }

      if (!document.getElementById('termos').checked) {
        mostrarMensagem('Você precisa aceitar os termos para continuar.');
        return;
      }

      botao.disabled = true;
      botao.textContent = 'Criando sua conta...';
      mensagem.classList.add('hidden');

      try {
        const { data, error } = await db.auth.signUp({
          email: email,
          password: senha,
          options: {
            data: {
              full_name: nome,
              phone: telefone,
              city: cidade
            }
          }
        });

        if (error) {
          throw error;
        }

        if (data.session) {
          mostrarMensagem(
            'Conta criada! Você já está conectado. Entrando no site...',
            'sucesso'
          );

          botao.textContent = 'Cadastro realizado!';

          window.location.replace('index.html');
          return;
        }

        mostrarMensagem(
          'Sua conta foi criada, mas o Supabase ainda exige confirmação do e-mail. É necessário desativar essa exigência nas configurações para entrar automaticamente.'
        );

        botao.disabled = false;
        botao.textContent = 'Tentar novamente';

      } catch (error) {
        console.error('Erro no cadastro:', error);

        let texto = error.message || 'Não foi possível concluir o cadastro.';

        if (error.message?.toLowerCase().includes('already registered')) {
          texto = 'Este e-mail já possui uma conta. Tente entrar pela página de login.';
        }

        mostrarMensagem(texto);

        botao.disabled = false;
        botao.textContent = 'Criar minha conta';
      }
    });
  </script>

</body>
</html>
