
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Turbeiros Garage</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'tuned-red': '#e63946',
            'tuned-dark': '#1d1d1d'
          }
        }
      }
    };
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">

  <header class="bg-tuned-dark text-white py-4 shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold">
        Turbeiros Garage
      </a>

      <nav id="mainNav" class="flex space-x-6 items-center">
        <a href="login.html" class="hover:text-tuned-red">Entrar</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center py-12 px-4">

    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-200 dark:border-gray-700">

      <h1 class="text-3xl font-bold text-center mb-2">
        Criar sua conta
      </h1>

      <p class="text-center text-gray-600 dark:text-gray-400 mb-8">
        Comece a comprar e vender carros modificados
      </p>

      <form id="cadastroForm" class="space-y-6">

        <div>
          <label for="nome" class="block text-sm font-medium mb-1">
            Nome completo
          </label>

          <input
            type="text"
            id="nome"
            required
            autocomplete="name"
            placeholder="Seu nome"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700"
          >
        </div>

        <div>
          <label for="email" class="block text-sm font-medium mb-1">
            Email
          </label>

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="seuemail@gmail.com"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700"
          >
        </div>

        <div>
          <label for="telefone" class="block text-sm font-medium mb-1">
            Telefone / WhatsApp
          </label>

          <input
            type="tel"
            id="telefone"
            required
            autocomplete="tel"
            placeholder="(41) 99999-9999"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700"
          >
        </div>

        <div>
          <label for="cidade" class="block text-sm font-medium mb-1">
            Cidade
          </label>

          <input
            type="text"
            id="cidade"
            required
            autocomplete="address-level2"
            placeholder="Sua cidade"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700"
          >
        </div>

        <div>
          <label for="senha" class="block text-sm font-medium mb-1">
            Senha
          </label>

          <input
            type="password"
            id="senha"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700"
          >
        </div>

        <div>
          <label for="confirmarSenha" class="block text-sm font-medium mb-1">
            Confirmar senha
          </label>

          <input
            type="password"
            id="confirmarSenha"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Digite novamente"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700"
          >
        </div>

        <div class="flex items-center">
          <input
            type="checkbox"
            id="termos"
            required
            class="h-4 w-4 text-tuned-red"
          >

          <label for="termos" class="ml-2 text-sm">
            Aceito os termos de uso e política de privacidade
          </label>
        </div>

        <div
          id="mensagem"
          role="alert"
          aria-live="polite"
          class="text-center text-sm font-medium hidden"
        ></div>

        <button
          type="submit"
          id="btnCadastrar"
          class="w-full bg-tuned-red hover:bg-red-700 text-white font-bold py-4 rounded-lg transition"
        >
          Cadastrar
        </button>

      </form>

      <p class="mt-6 text-center text-sm">
        Já tem conta?
        <a href="login.html" class="text-tuned-red hover:underline font-medium">
          Entrar
        </a>
      </p>

    </div>
  </main>

  <footer class="bg-tuned-dark text-white py-8 text-center">
    <p>© 2026 Turbeiros Garage - Marketplace de Carros Modificados</p>
  </footer>

  <script>
    const supabase = window.supabaseClient;

    const form = document.getElementById("cadastroForm");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("btnCadastrar");

    function mostrarMensagem(texto, sucesso = false) {
      mensagem.textContent = texto;

      mensagem.className = sucesso
        ? "text-center text-sm font-medium text-green-600"
        : "text-center text-sm font-medium text-red-600";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!supabase) {
        mostrarMensagem("Não foi possível conectar ao Supabase.");
        return;
      }

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email")
        .value.trim().toLowerCase();
      const telefone = document.getElementById("telefone")
        .value.trim();
      const cidade = document.getElementById("cidade")
        .value.trim();
      const senha = document.getElementById("senha").value;
      const confirmar = document.getElementById("confirmarSenha").value;

      if (senha.length < 8) {
        mostrarMensagem("A senha precisa ter pelo menos 8 caracteres.");
        return;
      }

      if (senha !== confirmar) {
        mostrarMensagem("As senhas não coincidem.");
        return;
      }

      if (!document.getElementById("termos").checked) {
        mostrarMensagem("Você precisa aceitar os termos para continuar.");
        return;
      }

      botao.disabled = true;
      botao.textContent = "Cadastrando...";
      mensagem.className = "hidden";

      try {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: senha,

          options: {
            data: {
              full_name: nome,
              phone: telefone,
              city: cidade
            }
          }
        });

        if (error) throw error;

        if (data.session) {
          mostrarMensagem(
            "Conta criada com sucesso! Redirecionando...",
            true
          );

          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);

        } else {
          mostrarMensagem(
            "Cadastro recebido! Verifique seu email e clique no link de confirmação para ativar sua conta.",
            true
          );

          botao.textContent = "Cadastro realizado";

          setTimeout(() => {
            window.location.href = "login.html";
          }, 4000);
        }

      } catch (error) {
        console.error("Erro no cadastro:", error);

        mostrarMensagem(
          error.message || "Não foi possível concluir o cadastro."
        );

        botao.disabled = false;
        botao.textContent = "Cadastrar";
      }
    });
  </script>

</body>
</html>
