
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbeiros Garage - Carros Modificados e Preparados</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'tuned-red': '#e63946',
            'tuned-dark': '#1d1d1d'
          }
        }
      }
    };
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">

  <header class="bg-tuned-dark text-white py-4 shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold">
        Turbeiros Garage
      </a>

      <nav id="mainNav" class="flex flex-wrap gap-4 items-center">
        <a href="login.html" class="hover:text-tuned-red">Entrar</a>
        <a href="cadastro.html"
           class="bg-tuned-red px-4 py-2 rounded hover:bg-red-700">
          Cadastrar
        </a>
      </nav>
    </div>
  </header>

  <section class="bg-gradient-to-r from-gray-900 to-black text-white py-20">
    <div class="container mx-auto px-4 text-center">

      <h1 class="text-4xl md:text-5xl font-bold mb-6">
        Encontre os Melhores Carros Modificados do Brasil
      </h1>

      <p class="text-xl mb-10">
        Preparados, tunados, stage 3, turbo, suspensão, estética...
      </p>

      <div class="max-w-5xl mx-auto bg-white/10 backdrop-blur-md p-6 rounded-xl">
        <form id="formBusca" class="grid grid-cols-1 md:grid-cols-4 gap-4">

          <input
            type="text"
            id="buscaModelo"
            placeholder="Marca / Modelo"
            class="p-3 rounded-lg text-black"
          >

          <input
            type="number"
            id="buscaPreco"
            placeholder="Preço até (R$)"
            min="0"
            class="p-3 rounded-lg text-black"
          >

          <select id="buscaAno" class="p-3 rounded-lg text-black">
            <option value="">Todos os anos</option>
            <option value="2020+">2020+</option>
            <option value="2015-2019">2015-2019</option>
          </select>

          <button
            type="submit"
            class="bg-tuned-red hover:bg-red-700 text-white font-bold p-3 rounded-lg"
          >
            Buscar
          </button>

        </form>
      </div>
    </div>
  </section>

  <section class="container mx-auto px-4 py-16">
    <h2 class="text-3xl font-bold mb-10 text-center">
      Destaques Recentes
    </h2>

    <div
      id="listaAnuncios"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
    >
      <p class="text-center col-span-full text-gray-500 py-12">
        Carregando veículos...
      </p>
    </div>
  </section>

  <footer class="bg-tuned-dark text-white py-12 text-center">
    <p>© 2026 Turbeiros Garage - Marketplace de Carros Modificados</p>
  </footer>

  <script>
    // CONEXÃO COM O SUPABASE
    const db = window.supabaseClient;
    const ADMIN_EMAIL = "julioqeu@gmail.com";

    const container = document.getElementById("listaAnuncios");
    const nav = document.getElementById("mainNav");

    let todosVeiculos = [];

    function criarTexto(tag, texto, classe = "") {
      const elemento = document.createElement(tag);
      elemento.textContent = texto ?? "";
      elemento.className = classe;
      return elemento;
    }

    // MENU DE LOGIN E CADASTRO
    function mostrarVisitante() {
      nav.replaceChildren();

      const entrar = document.createElement("a");
      entrar.href = "login.html";
      entrar.textContent = "Entrar";
      entrar.className = "hover:text-tuned-red";

      const cadastrar = document.createElement("a");
      cadastrar.href = "cadastro.html";
      cadastrar.textContent = "Cadastrar";
      cadastrar.className =
        "bg-tuned-red px-4 py-2 rounded hover:bg-red-700";

      nav.append(entrar, cadastrar);
    }

    async function carregarMenu() {
      // Primeiro mostra os botões para que o menu nunca fique preso
      // na mensagem de carregamento.
      mostrarVisitante();

      try {
        if (!db) {
          console.error("Cliente Supabase não encontrado.");
          return;
        }

        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        const user = data.session?.user;

        if (!user) return;

        nav.replaceChildren();

        const perfil = document.createElement("a");
        perfil.href = "perfil.html";
        perfil.textContent = "Perfil";
        perfil.className = "hover:text-tuned-red font-medium";
        nav.appendChild(perfil);

        if (user.email?.toLowerCase() === ADMIN_EMAIL) {
          try {
            const { data: isAdmin, error: adminError } =
              await db.rpc("is_admin");

            if (!adminError && isAdmin === true) {
              const admin = document.createElement("a");
              admin.href = "admin.html";
              admin.textContent = "Admin";
              admin.className = "text-green-400 hover:text-green-300";
              nav.appendChild(admin);
            }
          } catch (erro) {
            console.error("Erro ao verificar administrador:", erro);
          }
        }

        const sair = document.createElement("button");
        sair.textContent = "Sair";
        sair.className =
          "bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm";

        sair.addEventListener("click", async () => {
          sair.disabled = true;

          const { error: erroSaida } = await db.auth.signOut();

          if (erroSaida) {
            alert("Não foi possível sair da conta: " + erroSaida.message);
            sair.disabled = false;
            return;
          }

          window.location.href = "index.html";
        });

        nav.appendChild(sair);

      } catch (error) {
        console.error("Erro ao carregar menu:", error);
        mostrarVisitante();
      }
    }

    // CARREGAR VEÍCULOS PUBLICADOS
    async function carregarVeiculos() {
      container.replaceChildren(
        criarTexto(
          "p",
          "Carregando veículos...",
          "text-center col-span-full text-gray-500 py-12"
        )
      );

      try {
        if (!db) {
          throw new Error("Conexão com Supabase não encontrada.");
        }

        const { data, error } = await db
          .from("vehicles")
          .select(`
            id,
            brand,
            model,
            year,
            price,
            description,
            vehicle_images (
              image_url,
              position
            )
          `)
          .eq("status", "published")
          .order("created_at", { ascending: false });

        if (error) throw error;

        todosVeiculos = data || [];
        aplicarBusca();

      } catch (error) {
        console.error("Erro ao carregar veículos:", error);

        container.replaceChildren(
          criarTexto(
            "p",
            "Não foi possível carregar os veículos. " + error.message,
            "text-center col-span-full text-red-500 py-12"
          )
        );
      }
    }

    // EXIBIR ANÚNCIOS
    function renderizarVeiculos(veiculos) {
      container.replaceChildren();

      if (!veiculos.length) {
        container.appendChild(
          criarTexto(
            "p",
            "Nenhum veículo disponível no momento.",
            "text-center col-span-full text-xl text-gray-500 py-12"
          )
        );
        return;
      }

      veiculos.forEach((veiculo) => {
        const card = document.createElement("a");

        card.href = "anuncio.html?id=" + encodeURIComponent(veiculo.id);
        card.className =
          "bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition block";

        const imagens = [...(veiculo.vehicle_images || [])]
          .sort((a, b) => (a.position || 0) - (b.position || 0));

        const imagem =
          imagens[0]?.image_url ||
          "https://placehold.co/600x400?text=Sem+foto";

        const areaImagem = document.createElement("div");
        areaImagem.className = "relative";

        const img = document.createElement("img");
        img.src = imagem;
        img.alt = `${veiculo.brand} ${veiculo.model}`;
        img.className = "w-full h-48 object-cover";

        img.onerror = () => {
          img.onerror = null;
          img.src = "https://placehold.co/600x400?text=Sem+foto";
        };

        const preco = document.createElement("span");
        preco.className =
          "absolute top-3 left-3 bg-tuned-red text-white px-3 py-1 rounded-full text-sm font-bold";

        preco.textContent = veiculo.price === null
          ? "Preço sob consulta"
          : Number(veiculo.price).toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL"
            });

        areaImagem.append(img, preco);

        const conteudo = document.createElement("div");
        conteudo.className = "p-5";

        const titulo = criarTexto(
          "h3",
          `${veiculo.brand} ${veiculo.model} ${veiculo.year || ""}`,
          "font-bold text-xl"
        );

        const descricao = criarTexto(
          "p",
          veiculo.description || "Veículo preparado",
          "text-sm text-gray-500 dark:text-gray-400 mt-2 line-clamp-2"
        );

        conteudo.append(titulo, descricao);
        card.append(areaImagem, conteudo);
        container.appendChild(card);
      });
    }

    // FILTROS DE BUSCA
    function aplicarBusca() {
      const texto = document
        .getElementById("buscaModelo")
        .value.trim()
        .toLowerCase();

      const precoTexto = document.getElementById("buscaPreco").value;
      const precoMaximo = precoTexto === "" ? null : Number(precoTexto);

      const anoSelecionado =
        document.getElementById("buscaAno").value;

      const filtrados = todosVeiculos.filter((veiculo) => {
        const nome =
          `${veiculo.brand} ${veiculo.model}`.toLowerCase();

        const correspondeNome =
          !texto || nome.includes(texto);

        const correspondePreco =
          precoMaximo === null ||
          (veiculo.price !== null && Number(veiculo.price) <= precoMaximo);

        let correspondeAno = true;

        if (anoSelecionado === "2020+") {
          correspondeAno = Number(veiculo.year) >= 2020;
        }

        if (anoSelecionado === "2015-2019") {
          correspondeAno =
            Number(veiculo.year) >= 2015 &&
            Number(veiculo.year) <= 2019;
        }

        return correspondeNome &&
          correspondePreco &&
          correspondeAno;
      });

      renderizarVeiculos(filtrados);
    }

    document
      .getElementById("formBusca")
      .addEventListener("submit", (event) => {
        event.preventDefault();
        aplicarBusca();
      });

    // INICIALIZAÇÃO
    async function iniciarSite() {
      await Promise.all([
        carregarMenu(),
        carregarVeiculos()
      ]);
    }

    iniciarSite();
  </script>

</body>
</html>
