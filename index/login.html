
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d1d1d">

  <title>Entrar - Turbeiros Garage</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'tuned-red': '#e63946',
            'tuned-dark': '#1d1d1d'
          }
        }
      }
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
    }

    .logo-garage {
      color: #e63946;
    }

    .campo-login {
      transition: border-color .2s, box-shadow .2s;
    }

    .campo-login:focus {
      outline: none;
      border-color: #e63946;
      box-shadow: 0 0 0 3px rgba(230, 57, 70, .15);
    }

    .btn-entrar {
      transition: background .2s, transform .2s, opacity .2s;
    }

    .btn-entrar:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn-entrar:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .login-card {
        padding: 25px 20px;
      }

      .logo-titulo {
        font-size: 23px;
      }
    }
  </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">

  <!-- CABEÇALHO -->
  <header class="bg-tuned-dark text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3">

      <div class="flex flex-col sm:flex-row items-center justify-between gap-3">

        <a href="index.html"
           class="logo-titulo text-2xl font-extrabold tracking-wide text-center sm:text-left">
          TURBEIROS <span class="logo-garage">GARAGE</span>
        </a>

        <nav class="flex items-center justify-center gap-5 text-sm font-semibold">
          <a href="index.html"
             class="hover:text-red-400 transition">
            Início
          </a>

          <a href="cadastro.html"
             class="bg-tuned-red hover:bg-red-700 px-4 py-2 rounded-lg transition">
            Criar conta
          </a>
        </nav>

      </div>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main class="flex-grow flex items-center justify-center py-10 sm:py-14 px-4">

    <div class="login-card w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-200 dark:border-gray-700">

      <!-- ÍCONE -->
      <div class="flex justify-center mb-5">
        <div class="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center">

          <svg xmlns="http://www.w3.org/2000/svg"
               width="32"
               height="32"
               viewBox="0 0 24 24"
               fill="none"
               stroke="#e63946"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round">

            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>

          </svg>

        </div>
      </div>

      <h1 class="text-3xl font-extrabold text-center mb-2">
        Bem-vindo de volta!
      </h1>

      <p class="text-center text-gray-600 dark:text-gray-400 mb-8">
        Entre na sua conta para acessar sua área pessoal.
      </p>

      <!-- FORMULÁRIO -->
      <form id="loginForm" class="space-y-5">

        <div>
          <label for="email" class="block text-sm font-semibold mb-2">
            E-mail
          </label>

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="seuemail@gmail.com"
            class="campo-login w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
          >
        </div>

        <div>
          <label for="senha" class="block text-sm font-semibold mb-2">
            Senha
          </label>

          <div class="relative">

            <input
              type="password"
              id="senha"
              required
              autocomplete="current-password"
              placeholder="Digite sua senha"
              class="campo-login w-full px-4 py-3 pr-20 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
            >

            <button
              type="button"
              id="btnMostrarSenha"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-tuned-red hover:text-red-700"
            >
              Mostrar
            </button>

          </div>
        </div>

        <!-- MENSAGEM -->
        <div
          id="mensagem"
          role="alert"
          aria-live="polite"
          class="hidden text-center text-sm font-semibold rounded-lg p-3"
        ></div>

        <!-- BOTÃO -->
        <button
          type="submit"
          id="btnEntrar"
          class="btn-entrar w-full bg-tuned-red hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg"
        >
          Entrar na conta
        </button>

      </form>

      <!-- CADASTRO -->
      <div class="mt-7 text-center text-sm">
        <p class="text-gray-600 dark:text-gray-400">
          Ainda não tem uma conta?
        </p>

        <a href="cadastro.html"
           class="inline-block mt-2 text-tuned-red hover:text-red-700 font-bold hover:underline">
          Crie sua conta gratuitamente
        </a>
      </div>

      <div class="mt-6 border-t border-gray-200 dark:border-gray-700 pt-5 text-center">

        <a href="index.html"
           class="text-sm text-gray-500 dark:text-gray-400 hover:text-tuned-red transition">
          ← Voltar para a página inicial
        </a>

      </div>

    </div>

  </main>

  <!-- RODAPÉ -->
  <footer class="bg-tuned-dark text-white py-6 text-center mt-auto">
    <p class="text-sm text-gray-300">
      © 2026 <span class="font-bold">TURBEIROS</span>
      <span class="logo-garage font-bold">GARAGE</span>
      - Todos os direitos reservados.
    </p>
  </footer>

  <!-- JAVASCRIPT -->
  <script>
    // Cliente Supabase já configurado em supabaseClient.js.
    const db = window.supabaseClient;

    const form = document.getElementById("loginForm");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("btnEntrar");
    const campoSenha = document.getElementById("senha");
    const btnMostrarSenha = document.getElementById("btnMostrarSenha");

    function mostrarMensagem(texto, sucesso = false) {
      mensagem.textContent = texto;

      mensagem.className = sucesso
        ? "text-center text-sm font-semibold rounded-lg p-3 bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300"
        : "text-center text-sm font-semibold rounded-lg p-3 bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300";
    }

    // Mostrar ou esconder senha.
    btnMostrarSenha.addEventListener("click", () => {
      const senhaVisivel = campoSenha.type === "text";

      campoSenha.type = senhaVisivel ? "password" : "text";

      btnMostrarSenha.textContent = senhaVisivel
        ? "Mostrar"
        : "Ocultar";
    });

    // Login.
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!db) {
        mostrarMensagem("Não foi possível conectar ao Supabase. Verifique a configuração.");
        return;
      }

      const email = document.getElementById("email")
        .value.trim().toLowerCase();

      const senha = campoSenha.value;

      botao.disabled = true;
      botao.textContent = "Verificando acesso...";
      mensagem.className = "hidden";

      try {
        const { data, error } = await db.auth.signInWithPassword({
          email: email,
          password: senha
        });

        if (error) {
          throw error;
        }

        const usuario = data.user;

        if (!usuario) {
          throw new Error("Não foi possível identificar sua conta.");
        }

        // Verifica se o usuário é o administrador.
        if (usuario.email?.toLowerCase() === "julioqeu@gmail.com") {

          const { data: adminConfirmado, error: adminError } =
            await db.rpc("is_admin");

          if (adminError) {
            throw new Error(
              "Login realizado, mas não foi possível verificar a permissão de administrador."
            );
          }

          if (adminConfirmado === true) {
            mostrarMensagem(
              "Bem-vindo ao painel administrativo! Redirecionando...",
              true
            );

            window.location.href = "admin.html";
            return;
          }
        }

        // Usuários comuns vão para a página inicial.
        mostrarMensagem(
          "Login realizado com sucesso! Redirecionando...",
          true
        );

        window.location.href = "index.html";

      } catch (error) {
        console.error("Erro no login:", error);

        mostrarMensagem(
          error.message || "E-mail ou senha incorretos."
        );

      } finally {
        botao.disabled = false;
        botao.textContent = "Entrar na conta";
      }
    });
  </script>

</body>
</html>
